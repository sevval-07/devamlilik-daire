  :root {
    --paper: #0C1430;
    --panel: #16204A;
    --ink: #EDF1F8;
    --ink-soft: #9AA6C4;
    --ghost: #3A4A7A;
    --accent: #D98A6A;
    --rule: #2C3A66;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  .ui {
    position: fixed; inset: 0; pointer-events: none;
    padding: calc(22px + env(safe-area-inset-top, 0px)) 22px calc(22px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; justify-content: space-between; gap: 16px;
  }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }
  .id { font-size: 11px; letter-spacing: 0.16em; color: var(--ink-soft); }
  .id b { font-weight: 500; color: var(--ink); }
  .panel {
    background: var(--panel); border: 1px solid var(--rule); padding: 11px 13px;
    display: grid; grid-template-columns: auto auto; gap: 4px 16px;
    font-size: 11px; font-variant-numeric: tabular-nums; color: var(--ink-soft);
  }
  .panel dt, .panel dd { margin: 0; }
  .panel dd { text-align: right; color: var(--ink); }
  .bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .text {
    max-width: 42ch;
    font-family: "Instrument Serif", Georgia, serif;
    font-size: clamp(17px, 1.8vw, 26px); line-height: 1.36; color: var(--ink);
    background: rgba(12, 20, 48, 0.82); padding: 10px 14px; margin: 0 0 0 -14px;
    transition: opacity 0.5s ease;
  }
  .text.is-hidden { opacity: 0; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .tool {
    pointer-events: auto; font: inherit; font-size: 11px; letter-spacing: 0.06em;
    color: var(--ink-soft); background: transparent; border: 1px solid var(--rule);
    padding: 7px 12px; cursor: pointer;
  }
  .tool:hover { color: var(--ink); border-color: var(--ink-soft); }
  .tool:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  @media (max-width: 560px) { .text { font-size: 16px; max-width: 28ch; } .panel { font-size: 10px; } }
</style>
</head>
<body>

<canvas id="c" aria-label="Yavaşça dönen ve salınan tek bir kapalı çizgi. Dokunulan yerde çizginin biçimi kalıcı olarak değişir; ilk dairesel hâline dönmez."></canvas>

<div class="ui">
  <div class="top">
    <span class="id"><b>Değişen Çevre</b> · tek kapalı çizgi</span>
  </div>
  <div class="bottom">
    <p class="text" id="text">Hiçbir varlık içine doğduğu düzeni bulduğu gibi bırakmaz. Var olmak, evrenin hiç durmayan hareketine katılmak ve o hareketi kendi eylemiyle değiştirmektir; geriye kalan her yüzey, bu değişimlerin donmuş kaydıdır.</p>
    <div class="tools">
      <button class="tool" id="toggle" type="button" aria-pressed="true">Metni gizle</button>
      <button class="tool" id="fresh" type="button">Başka bir evren</button>
      <button class="tool" id="full" type="button">Tam ekran</button>
    </div>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const textEl = document.getElementById('text');

  const N = 260;                      // çizgiyi oluşturan nokta sayısı
  const R = new Float32Array(N);      // dinlenme yarıçapı — kalıcı biçim
  const U = new Float32Array(N);      // salınım
  const P = new Float32Array(N);      // bir önceki salınım
  let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, R0 = 0, rot = 0, t0 = 0, touches = 0, lastTouch = -9, seed = 0;
  const ptr = { x: 0, y: 0, on: false };

  function rng(s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; let r = Math.imul(s ^ s >>> 15, 1 | s); r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r; return ((r ^ r >>> 14) >>> 0) / 4294967296; }; }

  function build(fresh) {
    if (fresh) seed++;
    const rnd = rng(20260927 + seed * 977);
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W / 2; cy = H / 2; R0 = Math.min(W, H) * 0.3;

    // başlangıç: kusursuz bir daire, ama baştan salınım hâlinde
    const m1 = 2 + Math.floor(rnd() * 2), m2 = 4 + Math.floor(rnd() * 3), ph = rnd() * 6.28;
    for (let i = 0; i < N; i++) {
      const a = i / N * 6.28318;
      R[i] = R0;
      U[i] = R0 * (0.018 * Math.sin(a * m1 + ph) + 0.010 * Math.sin(a * m2 - ph));
      // önceki değer: dalgayı yavaşça dolaştıran bir başlangıç hızı
      P[i] = U[i] - R0 * (0.0016 * Math.cos(a * m1 + ph) + 0.0012 * Math.cos(a * m2 - ph));
    }
    rot = rnd() * 6.28; t0 = performance.now(); touches = 0;
  }

  const C = 0.09, K = 0.0005, LIM = 0.24;   // komşu bağı, geri çağırma, salınım sınırı — sönüm yok
  const A = new Float32Array(N);
  function step() {
    // ivmeler önce topluca hesaplanır: yerinde güncelleme salınıma enerji katardı
    for (let i = 0; i < N; i++) {
      const l = U[(i - 1 + N) % N], r = U[(i + 1) % N];
      A[i] = C * (l + r - 2 * U[i]) - K * U[i];
    }
    const lim = R0 * LIM;
    for (let i = 0; i < N; i++) {
      const v = U[i] - P[i] + A[i];
      P[i] = U[i];
      U[i] += v;
      if (U[i] > lim) { U[i] = lim; P[i] = lim; }
      else if (U[i] < -lim) { U[i] = -lim; P[i] = -lim; }
    }
    rot += 0.00055;                          // yavaş, hiç durmayan dönüş
    if (ptr.on) shape();
  }

  function shape() {
    const dx = ptr.x - cx, dy = ptr.y - cy;
    const d = Math.hypot(dx, dy);
    if (d < 4) return;
    const pa = Math.atan2(dy, dx) - rot;
    const reach = 0.7;                       // etki genişliği (radyan)
    for (let i = 0; i < N; i++) {
      let da = i / N * 6.28318 - pa;
      da = Math.atan2(Math.sin(da), Math.cos(da));
      const ad = Math.abs(da);
      if (ad > reach) continue;
      const f = 0.5 + 0.5 * Math.cos(ad / reach * Math.PI);
      R[i] += (d - R[i]) * 0.055 * f;          // biçimin kendisi değişiyor, kalıcı olarak
      U[i] += (d - (R[i] + U[i])) * 0.01 * f;  // ve bu değişim salınıma da karışıyor
      const lo = R0 * 0.35, hi = R0 * 1.7;
      if (R[i] < lo) R[i] = lo; else if (R[i] > hi) R[i] = hi;
    }
  }

  function draw() {
    ctx.fillStyle = '#0C1430'; ctx.fillRect(0, 0, W, H);

    // içine doğulan düzen: kusursuz daire, artık ulaşılamıyor
    ctx.strokeStyle = '#3A4A7A'; ctx.lineWidth = 1; ctx.setLineDash([2, 6]);
    ctx.beginPath(); ctx.arc(cx, cy, R0, 0, 6.28318); ctx.stroke();
    ctx.setLineDash([]);

    // çizginin kendisi
    const px = new Float32Array(N), py = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      const a = i / N * 6.28318 + rot, rr = R[i] + U[i];
      px[i] = cx + Math.cos(a) * rr; py[i] = cy + Math.sin(a) * rr;
    }
    ctx.beginPath();
    ctx.moveTo((px[N - 1] + px[0]) / 2, (py[N - 1] + py[0]) / 2);
    for (let i = 0; i < N; i++) {
      const j = (i + 1) % N;
      ctx.quadraticCurveTo(px[i], py[i], (px[i] + px[j]) / 2, (py[i] + py[j]) / 2);
    }
    ctx.closePath();
    ctx.strokeStyle = '#EDF1F8'; ctx.lineWidth = 1.4; ctx.stroke();

    if (ptr.on) {
      ctx.strokeStyle = 'rgba(217,138,106,0.7)'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(ptr.x - 8, ptr.y); ctx.lineTo(ptr.x + 8, ptr.y);
      ctx.moveTo(ptr.x, ptr.y - 8); ctx.lineTo(ptr.x, ptr.y + 8);
      ctx.stroke();
    }
  }

  let acc = 0, last = performance.now();
  function frame(now) {
    acc += Math.min(0.05, (now - last) / 1000); last = now;
    while (acc > 1 / 60) { step(); acc -= 1 / 60; }
    draw();
    requestAnimationFrame(frame);
  }

  canvas.addEventListener('pointerdown', e => {
    ptr.on = true; ptr.x = e.clientX; ptr.y = e.clientY;
    const s = performance.now() / 1000;
    if (s - lastTouch > 0.4) { touches++; }
    lastTouch = s;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    ptr.x = e.clientX; ptr.y = e.clientY;
    if (e.pointerType === 'mouse' && !e.buttons) ptr.on = false;
    else if (ptr.on) lastTouch = performance.now() / 1000;
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => canvas.addEventListener(t, () => { ptr.on = false; }));

  const toggle = document.getElementById('toggle');
  toggle.addEventListener('click', () => {
    const h = textEl.classList.toggle('is-hidden');
    toggle.textContent = h ? 'Metni göster' : 'Metni gizle';
    toggle.setAttribute('aria-pressed', String(!h));
  });
  document.getElementById('fresh').addEventListener('click', () => build(true));
  document.getElementById('full').addEventListener('click', () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement);
    } catch (err) { /* ortam izin vermiyor */ }
  });
  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 't') toggle.click(); else if (k === 'n') build(true); else if (k === 'f') document.getElementById('full').click();
  });

  // ekran ölçüsü değişirse biçim korunur, yalnızca ölçeklenir
  let rt; window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      const ratio = Array.from(R, v => v / R0), touched = touches, t = t0;
      build(false);
      for (let i = 0; i < N; i++) R[i] = ratio[i] * R0;
      touches = touched; t0 = t;
    }, 200);
  });
  build(false);
  requestAnimationFrame(frame);
})();
</script>
